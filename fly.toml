# Fly.io 部署模板（示例为 case-01）。每个案例复制一份，改 app + CASE 即可。
app: agent-01
primary_region: hkg

build:
  dockerfile: Dockerfile
  args:
    CASE: 01_tool_call_parse

env:
  LLM_MODEL: gpt-4o-mini

http_service:
  internal_port: 8000
  force_https: true
  auto_stop_machines: true
  auto_start_machines: true
